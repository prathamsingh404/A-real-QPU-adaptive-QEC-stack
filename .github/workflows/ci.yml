name: CI & Scientific Reproducibility Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Nightly smoke run at 02:00 UTC
    - cron: '0 2 * * *'

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify Scientific Claims Ledger (Zero-Drift Enforcement)
        run: |
          python scripts/make_claims.py --check

      - name: Run Test Suite
        run: |
          pytest -v --tb=short

      - name: Verify Architecture Boundaries (No Oracle Peeking)
        run: |
          pytest tests/test_architecture_boundaries.py -v

      - name: Nightly Experiment Smoke Run
        run: |
          python -m adaptive_qec.experiments.adaptive_vs_static --distance 3 --rounds 3 --seed 42
