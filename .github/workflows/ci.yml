name: CI & Scientific Reproducibility Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Nightly smoke run at 02:00 UTC
    - cron: '0 2 * * *'

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify Cryptographic SHA-256 Provenance Lock
        run: |
          python scripts/verify_lock.py

      - name: Verify Zero Hardcoded Result Constants (AST Check)
        run: |
          pytest tests/test_no_hardcoded_results.py -v

      - name: Verify Submission Gates A, B, and C
        run: |
          python scripts/verify_gates_a_b_c.py

      - name: Verify Scientific Claims Ledger
        run: |
          python scripts/make_claims.py --check

      - name: Run Test Suite
        run: |
          pytest -v --tb=short

      - name: Verify Architecture Boundaries (No Oracle Peeking)
        run: |
          pytest tests/test_architecture_boundaries.py -v
