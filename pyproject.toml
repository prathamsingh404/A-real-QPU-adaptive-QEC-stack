[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-qec"
version = "0.2.0"
description = "An experimental platform for hardware-aware, adaptive, low-latency quantum error correction"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "AdaptiveQEC Team"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Quantum stack
    "stim>=1.15",
    "pymatching>=2.2",
    "qiskit>=1.3",
    "qiskit-ibm-runtime>=0.35",

    # Numerical / scientific
    "numpy>=1.26",
    "scipy>=1.12",

    # Configuration
    "pydantic>=2.0",
    "pyyaml>=6.0",

    # Visualization
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.18",

    # API layer
    "fastapi>=0.115",
    "uvicorn>=0.32",

    # Utilities
    "rich>=13.0",
    "click>=8.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.10",
]
ml = [
    "torch>=2.2",
    "onnxruntime>=1.17",
]
gpu = [
    "cupy>=13.0",
]
deltakit = [
    "deltakit",
]

[project.scripts]
aqec = "adaptive_qec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
